<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eλληνικές εκπαιδευτικές κάρτες</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    color: #e8eaf0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: #7c85a6;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  /* ── Views ── */
  #import-view, #level-view, #main-view, #session-end {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  #import-view.active, #level-view.active, #main-view.active, #session-end.active {
    display: flex;
  }

  /* ── Import screen ── */
  #import-view {
    gap: 20px;
    max-width: 480px;
    text-align: center;
  }

  .import-box {
    width: 100%;
    border: 2px dashed #252a3d;
    border-radius: 16px;
    padding: 48px 32px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: #181c2a;
  }

  .import-box:hover, .import-box.drag-over {
    border-color: #4f7cff;
    background: #1a2040;
  }

  .import-box p { color: #4a5170; font-size: 0.9rem; line-height: 1.8; }
  .import-box .import-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4; }
  .import-box strong { color: #7c85a6; }
  #file-input { display: none; }

  .import-status { font-size: 0.85rem; color: #4a5170; min-height: 20px; }
  .import-status.error { color: #c0394f; }
  .import-status.success { color: #22a55a; }

  .detected-fields {
    font-size: 0.78rem;
    color: #4a5170;
    background: #181c2a;
    border: 1px solid #252a3d;
    border-radius: 10px;
    padding: 10px 16px;
    text-align: left;
    line-height: 1.8;
    max-width: 480px;
    width: 100%;
  }
  .detected-fields .found { color: #22a55a; }
  .detected-fields .missing { color: #5a4040; }

  .btn-skip {
    background: none;
    border: none;
    color: #3a4060;
    font-size: 0.8rem;
    cursor: pointer;
    text-decoration: underline;
    padding: 4px;
  }
  .btn-skip:hover { color: #5a6080; }

  /* ── Level select screen ── */
  #level-view {
    max-width: 1000px;
    gap: 24px;
  }

  .level-tabs {
    display: flex;
    gap: 0;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #252a3d;
  }

  .level-tab-btn {
    padding: 10px 28px;
    background: #181c2a;
    border: none;
    color: #4a5170;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: all 0.2s;
  }
  .level-tab-btn.active {
    background: #2a3060;
    color: #a0b4ff;
  }

  .level-panels { width: 100%; }
  .level-panel { display: none; }
  .level-panel.active { display: block; }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    width: 100%;
  }

  .level-tile {
    background: #181c2a;
    border: 1px solid #252a3d;
    border-radius: 12px;
    padding: 14px 12px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s, transform 0.15s;
    position: relative;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .level-tile:hover:not(.locked) {
    transform: translateY(-1px);
    filter: brightness(1.12);
  }

  .level-tile.locked {
    cursor: default;
    opacity: 0.45;
  }

  .level-tile-title {
    font-size: 0.78rem;
    font-weight: 600;
    color: #7c85a6;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .level-tile-range {
    font-size: 0.68rem;
    color: #3a4060;
  }

  .level-tile-progress {
    font-size: 0.68rem;
    color: #4a5170;
    margin-top: auto;
  }

  .level-tile-bar {
    height: 2px;
    background: #1e2130;
    border-radius: 2px;
    overflow: hidden;
  }

  .level-tile-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #4f7cff, #a78bfa);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .tile-counts {
    display: flex;
    gap: 5px;
    justify-content: center;
    margin-top: 5px;
    min-height: 18px;
  }
  .tile-counts span {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 8px;
    line-height: 1.4;
  }
  .tc-new      { background: #1a3a6e; color: #6aabff; }
  .tc-learning { background: #4a1a1a; color: #ff8c69; }
  .tc-due      { background: #0d3320; color: #4cde8a; }

  .level-lock-icon {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 0.7rem;
    opacity: 0.4;
  }

  /* Custom range section */
  .custom-range {
    width: 100%;
    border: 1px solid #252a3d;
    border-radius: 12px;
    background: #181c2a;
    overflow: hidden;
  }

  .custom-range-header {
    padding: 12px 18px;
    cursor: pointer;
    font-size: 0.8rem;
    color: #4a5170;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 0.2s;
  }
  .custom-range-header:hover { color: #7c85a6; }
  .custom-range-header .chevron { transition: transform 0.2s; font-size: 0.6rem; }
  .custom-range-header.open .chevron { transform: rotate(90deg); }

  .custom-range-body {
    display: none;
    padding: 16px 18px;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    border-top: 1px solid #252a3d;
  }
  .custom-range-body.open { display: flex; }

  .custom-range-body label { font-size: 0.78rem; color: #4a5170; }
  .custom-range-body input[type=number] {
    width: 70px;
    padding: 6px 10px;
    background: #0f1117;
    border: 1px solid #252a3d;
    border-radius: 8px;
    color: #e8eaf0;
    font-size: 0.85rem;
    text-align: center;
  }

  .dir-select {
    display: flex;
    gap: 0;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #252a3d;
  }
  .dir-select button {
    padding: 6px 14px;
    background: #181c2a;
    border: none;
    color: #4a5170;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }
  .dir-select button.active { background: #2a3060; color: #a0b4ff; }

  .btn-practice {
    padding: 8px 20px;
    background: linear-gradient(135deg, #2a3060, #3a4170);
    border: 1px solid #3a4170;
    border-radius: 8px;
    color: #a0b4ff;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }
  .btn-practice:hover { background: linear-gradient(135deg, #3a4060, #4a5280); }

  /* ── Progress bar (session) ── */
  .progress-bar-wrap {
    width: 100%;
    max-width: 480px;
    height: 3px;
    background: #1e2130;
    border-radius: 2px;
    margin-bottom: 12px;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #4f7cff, #a78bfa);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 0.75rem;
    color: #4a5170;
    text-align: right;
    max-width: 480px;
    width: 100%;
    margin-bottom: 28px;
  }

  /* ── Card ── */
  .scene {
    width: 480px;
    max-width: 100%;
    perspective: 1200px;
    cursor: pointer;
    margin-bottom: 28px;
    position: relative;
  }

  .card {
    width: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 32px;
    gap: 12px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  /* front face sets scene height */
  .card-front {
    position: relative;
    background: #181c2a;
    border: 1px solid #252a3d;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    min-height: 280px;
    justify-content: center;
  }

  .card-back {
    background: #181c2a;
    border: 1px solid #2d3255;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    transform: rotateY(180deg);
    top: 0;
    min-height: 280px;
    justify-content: center;
  }

  .card.complete-glow .card-back {
    border-color: #f5c518;
    box-shadow: 0 0 30px rgba(245,197,24,0.4), 0 8px 40px rgba(0,0,0,0.4);
  }

  .card-lang {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #4f7cff;
    font-weight: 500;
  }

  .card-word {
    font-size: 2.4rem;
    font-weight: 300;
    color: #e8eaf0;
    text-align: center;
    line-height: 1.2;
  }

  .card-hint { font-size: 0.75rem; color: #3a4060; margin-top: 8px; }

  .card-answer-label {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #5a4a8a;
    font-weight: 500;
  }

  .card-answer {
    font-size: 2rem;
    font-weight: 400;
    color: #a78bfa;
    text-align: center;
  }

  /* Sentence section on card back */
  .card-sentence-area {
    width: 100%;
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .sentence-gr {
    font-size: 0.9rem;
    color: #6b7499;
    text-align: center;
    line-height: 1.6;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .sentence-gr.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .sentence-en {
    font-size: 0.78rem;
    color: #4a5170;
    text-align: center;
    font-style: italic;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .sentence-en.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Frequency badge */
  .freq-badge {
    position: absolute;
    bottom: 12px;
    right: 14px;
    font-size: 0.7rem;
    font-weight: 600;
    opacity: 0.85;
    letter-spacing: 0.03em;
  }

  /* Keyboard hint */
  .kbd-hint {
    font-size: 0.7rem;
    color: #252a3d;
    text-align: center;
    max-width: 480px;
    width: 100%;
    margin-top: -16px;
    margin-bottom: 12px;
    transition: opacity 0.5s;
    letter-spacing: 0.04em;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease 0.2s;
  }
  .btn-row.visible { opacity: 1; pointer-events: all; }

  button {
    padding: 12px 36px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.03em;
  }
  button:active { transform: scale(0.97); }

  .btn-correct {
    background: linear-gradient(135deg, #1a6b3a, #22a55a);
    color: #d4f5e2;
    box-shadow: 0 4px 20px rgba(34,165,90,0.25);
  }
  .btn-correct:hover { box-shadow: 0 4px 28px rgba(34,165,90,0.4); }

  .btn-wrong {
    background: linear-gradient(135deg, #6b1a2a, #c0394f);
    color: #fdd8de;
    box-shadow: 0 4px 20px rgba(192,57,79,0.25);
  }
  .btn-wrong:hover { box-shadow: 0 4px 28px rgba(192,57,79,0.4); }

  .main-view-header {
    width: 100%;
    max-width: 420px;
    margin-bottom: 8px;
  }

  .btn-back-to-levels {
    background: linear-gradient(135deg, #2a2f4a, #3a4170);
    color: #a0aacc;
    padding: 10px 28px;
    border-radius: 10px;
    border: 1px solid #3a4170;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 0.04em;
    margin-top: 4px;
  }
  .btn-back-to-levels:hover { background: linear-gradient(135deg, #3a4060, #4a5280); }

  /* Session end */
  #session-end {
    gap: 20px;
    text-align: center;
  }
  #session-end h2 {
    font-size: 1.6rem;
    font-weight: 300;
    color: #a78bfa;
  }
  .session-stats {
    font-size: 0.9rem;
    color: #5a6080;
    line-height: 1.8;
  }
  .session-stats span { color: #e8eaf0; font-weight: 500; }

  .btn-restart {
    background: linear-gradient(135deg, #2a2f4a, #3a4170);
    color: #a0aacc;
    padding: 12px 40px;
    border-radius: 10px;
    border: 1px solid #3a4170;
    font-size: 0.9rem;
    cursor: pointer;
    letter-spacing: 0.05em;
  }
  .btn-restart:hover { background: linear-gradient(135deg, #3a4060, #4a5280); }

  /* ── Loading spinner ── */
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #1e2130;
    border-top-color: #4f7cff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Audio controls (fixed bottom-right) ── */
  #audio-controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    z-index: 100;
  }

  #btn-speaker {
    width: 36px; height: 36px;
    background: none;
    border: none;
    font-size: 1.1rem;
    cursor: pointer;
    opacity: 0.2;
    transition: opacity 0.3s;
    padding: 0;
    border-radius: 50%;
  }
  #btn-speaker:hover, #btn-speaker.active { opacity: 1; }

  #volume-popover {
    background: #181c2a;
    border: 1px solid #252a3d;
    border-radius: 10px;
    padding: 10px 14px;
    display: none;
  }
  #volume-popover.open { display: block; }
  #volume-slider { width: 80px; accent-color: #4f7cff; }

  /* ── Bag icon (fixed bottom-right, behind audio) ── */
  #bag-icon {
    position: fixed;
    bottom: 20px;
    right: 64px;
    font-size: 1.3rem;
    opacity: 0.15;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 99;
    pointer-events: none;
  }
  #bag-icon.pulse {
    animation: bagPulse 0.5s ease-out forwards;
  }
  @keyframes bagPulse {
    0% { transform: scale(1); opacity: 0.15; }
    30% { transform: scale(1.4); opacity: 1; }
    100% { transform: scale(1); opacity: 0.15; }
  }


  /* ── Complete fly animation ── */
  @keyframes flyToBag {
    0% { transform: scale(1) translate(0, 0); opacity: 1; }
    100% { transform: scale(0.1) translate(calc(50vw - 80px), calc(50vh)); opacity: 0; }
  }
  .card.flying {
    animation: flyToBag 0.4s ease-in forwards;
  }


</style>
</head>
<body>

<h1>Eλληνικές σημειώσεις</h1>

<!-- Import screen -->
<div id="import-view">
  <div class="import-box" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <div class="import-icon">📦</div>
    <p><strong>Drop your .apkg file here</strong><br>or click to browse<br><br>
    Imported words are saved permanently —<br>you only need to do this once.</p>
  </div>
  <input type="file" id="file-input" accept=".apkg">
  <div class="import-status" id="import-status"></div>
  <div class="detected-fields" id="detected-fields" style="display:none"></div>
  <button class="btn-skip" onclick="useBuiltinWords()">Use built-in 100 words instead</button>
</div>

<!-- Level select screen -->
<div id="level-view">
  <div class="level-tabs">
    <button class="level-tab-btn active" id="tab-en" onclick="switchTab('en')">EN → GR</button>
    <button class="level-tab-btn" id="tab-gr" onclick="switchTab('gr')">GR → EN</button>
  </div>

  <div class="level-panels">
    <div class="level-panel active" id="panel-en">
      <div class="level-grid" id="grid-en"></div>
    </div>
    <div class="level-panel" id="panel-gr">
      <div class="level-grid" id="grid-gr"></div>
    </div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:4px;">
    <div style="display:flex; gap:6px;">
      <button class="btn-skip" onclick="exportProgress()" style="font-size:0.72rem;">↓ Export progress</button>
      <button class="btn-skip" onclick="document.getElementById('progress-file-input').click()" style="font-size:0.72rem;">↑ Import progress</button>
      <input type="file" id="progress-file-input" accept=".json" style="display:none" onchange="importProgress(this)">
    </div>
    <button class="btn-skip" onclick="showImport()" style="font-size:0.72rem;">↑ Re-import deck</button>
  </div>

  <div class="custom-range" id="custom-range-section">
    <div class="custom-range-header" id="custom-range-toggle" onclick="toggleCustomRange()">
      <span class="chevron">▶</span> Custom range
    </div>
    <div class="custom-range-body" id="custom-range-body">
      <label>From rank</label>
      <input type="number" id="range-from" value="1" min="1">
      <label>to</label>
      <input type="number" id="range-to" value="100" min="1">
      <div class="dir-select" id="custom-dir-select">
        <button class="active" id="cdir-en" onclick="setCustomDir('en')">EN→GR</button>
        <button id="cdir-gr" onclick="setCustomDir('gr')">GR→EN</button>
        <button id="cdir-both" onclick="setCustomDir('both')">Both</button>
      </div>
      <button class="btn-practice" onclick="startCustomRange()">Practice</button>
    </div>
  </div>
</div>

<!-- Session / main view -->
<div id="main-view">
  <div class="main-view-header">
    <button class="btn-back-to-levels" onclick="abandonSession()">← Levels</button>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
  <div class="progress-label" id="progress-label"></div>

  <div class="scene" id="scene" onclick="onCardClick()">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="card-lang" id="front-lang"></div>
        <div class="card-word" id="front-word"></div>
        <div class="card-hint" id="card-hint">tap or press Space to reveal</div>
      </div>
      <div class="card-face card-back">
        <div class="card-answer-label" id="back-lang"></div>
        <div class="card-answer" id="back-word"></div>
        <div class="card-sentence-area">
          <div class="sentence-gr" id="sentence-gr"></div>
          <div class="sentence-en" id="sentence-en"></div>
        </div>
        <div class="freq-badge" id="freq-badge"></div>
      </div>
    </div>
  </div>

  <div class="kbd-hint" id="kbd-hint">Space = flip &nbsp;·&nbsp; Space = correct &nbsp;·&nbsp; Backspace = wrong &nbsp;·&nbsp; Enter = replay audio</div>

  <div class="btn-row" id="btn-row">
    <button class="btn-wrong" onclick="answer(false)">✗ Wrong</button>
    <button class="btn-correct" onclick="answer(true)">✓ Correct</button>
  </div>
</div>

<!-- Session end -->
<div id="session-end">
  <h2>Session complete</h2>
  <div class="session-stats" id="session-stats"></div>
  <button class="btn-restart" onclick="startSession()">Next session</button>
  <button class="btn-back-to-levels" onclick="showLevelSelect()">← Back to levels</button>
</div>

<!-- Fixed UI -->
<audio id="audio-el"></audio>

<div id="audio-controls">
  <div id="volume-popover">
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
  </div>
  <button id="btn-speaker" onclick="toggleAudioControls(event)">🔊</button>
</div>

<div id="bag-icon">🎒</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// BUILT-IN WORDS (fallback)
// ═══════════════════════════════════════════════════════════════════════════════
const BUILTIN_WORDS = [
  {en:"yes",gr:"ναι"},{en:"no",gr:"όχι"},{en:"hello",gr:"γεια σου"},{en:"goodbye",gr:"αντίο"},
  {en:"please",gr:"παρακαλώ"},{en:"thank you",gr:"ευχαριστώ"},{en:"sorry",gr:"συγγνώμη"},

// INDEXEDDB
// ═══════════════════════════════════════════════════════════════════════════════
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('words')) db.createObjectStore('words', { keyPath: 'rank' });
      if (!db.objectStoreNames.contains('audio')) db.createObjectStore('audio');
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function dbGet(store, key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

function dbGetAll(store) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

function dbPut(store, value, key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = key !== undefined ? tx.objectStore(store).put(value, key) : tx.objectStore(store).put(value);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

function dbPutBatch(store, entries) {
  // entries: array of {key, value} for audio store, or array of objects for words store
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const os = tx.objectStore(store);
    for (const entry of entries) {
      if (entry.key !== undefined) {
        os.put(entry.value, entry.key);
      } else {
        os.put(entry);
      }
    }
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

function dbClearStore(store) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

// PROGRESS EXPORT / IMPORT
// ═══════════════════════════════════════════════════════════════════════════════
function exportProgress() {
  const srs = loadSRS();
  const date = new Date().toISOString().slice(0, 10);
  const payload = { version: 1, exported: new Date().toISOString(), srs };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `greek_progress_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importProgress(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = ''; // reset so same file can be picked again

  const reader = new FileReader();
  reader.onload = e => {
    let payload;
    try {
      payload = JSON.parse(e.target.result);
      if (!payload.srs || typeof payload.srs !== 'object') throw new Error('Invalid format');
    } catch {
      alert('Could not read progress file — make sure it is a valid export from this app.');
      return;
    }

    const incoming = payload.srs;
    const current = loadSRS();
    const hasCurrentData = Object.keys(current).length > 0;

    if (!hasCurrentData) {
      // Nothing here yet — just replace
      saveSRS(incoming);
      renderLevelGrids();
      alert(`Progress imported: ${Object.keys(incoming).length} card entries loaded.`);
      return;
    }

    // Ask user how to handle conflict
    const choice = confirm(
      `You already have progress data on this device.\n\n` +
      `OK = Replace all (use imported file)\n` +
      `Cancel = Merge (keep best streak & sum seen/correct/incorrect)`
    );

    if (choice) {
      // Replace
      saveSRS(incoming);
    } else {
      // Merge: union of keys, per-card take best streak/complete, sum counts, union days
      const merged = Object.assign({}, current);
      for (const [key, inc] of Object.entries(incoming)) {
        if (!merged[key]) {
          merged[key] = inc;
        } else {
          const cur = merged[key];
          // SRS: keep higher streak/reps; if imported has more reps, trust its interval/easeFactor too
          if ((inc.reps || 0) > (cur.reps || 0)) {
            cur.interval = inc.interval;
            cur.easeFactor = inc.easeFactor;
            cur.nextReview = inc.nextReview;
            cur.reps = inc.reps;
          }
          cur.streak = Math.max(cur.streak || 0, inc.streak || 0);
          cur.complete = cur.complete || inc.complete;
          // Stats: sum
          cur.seen = (cur.seen || 0) + (inc.seen || 0);
          cur.correct = (cur.correct || 0) + (inc.correct || 0);
          cur.incorrect = (cur.incorrect || 0) + (inc.incorrect || 0);
          // Days: union
          const daySet = new Set([...(cur.days || []), ...(inc.days || [])]);
          cur.days = [...daySet].sort();
        }
      }
      saveSRS(merged);
    }

    renderLevelGrids();
    const count = Object.keys(incoming).length;
    alert(`Progress imported: ${count} card entries ${choice ? 'replaced' : 'merged'}.`);
  };
  reader.readAsText(file);
}

function cardKey(word, dir) {
  if (word.rank) return `r${word.rank}_${dir}`;
  return word.en.replace(/[^a-zA-Z0-9]/g, '_').replace(/_+/g, '_') + '_' + dir;
}

function getCardData(data, word, dir) {
  const key = cardKey(word, dir);
  if (!data[key]) data[key] = { interval: 0, easeFactor: 2.5, nextReview: 0, reps: 0, streak: 0, complete: false, seen: 0, correct: 0, incorrect: 0, days: [] };
  const cd = data[key];
  if (cd.streak === undefined) cd.streak = 0;
  if (cd.complete === undefined) cd.complete = false;
  if (cd.seen === undefined) cd.seen = 0;
  if (cd.correct === undefined) cd.correct = 0;
  if (cd.incorrect === undefined) cd.incorrect = 0;
  if (cd.days === undefined) cd.days = [];
  return cd;
}

  // Fallback: check old localStorage key
  try {

    if (raw) {

      if (oldWords && oldWords.length > 0) {
        // Assign rank if missing
        oldWords.forEach((w, i) => { if (!w.rank) w.rank = i + 1; });
        WORDS = oldWords;
        await dbPutBatch('words', WORDS);
        showLevelSelect();
        return;
      }
    }
  } catch {}

  showImport();
}

async function processApkg(file) {
  const spinner = document.createElement('div');
  spinner.className = 'spinner';
  setStatus(spinner);
  document.getElementById('detected-fields').style.display = 'none';

  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js');

    setStatus('Unzipping…');
    let ab = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(ab);
    ab = null; // free RAM

    const dbEntry = zip.file('collection.anki21') || zip.file('collection.anki2');
    if (!dbEntry) throw new Error('No collection database found in .apkg file.');

    setStatus('Reading database…');
    const dbBytes = await dbEntry.async('uint8array');

    const SQL = await initSqlJs({
      locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`
    });
    const db = new SQL.Database(dbBytes);

    setStatus('Extracting cards…');
    const { words, detectedFields, allFieldNames } = extractWords(db);
    db.close();
    console.log('All model field names:', allFieldNames);

    if (words.length === 0) throw new Error('No usable EN↔GR pairs found.');

    // Show detected fields summary
    showDetectedFields(detectedFields);

    // Save words to IndexedDB
    setStatus(`Saving ${words.length} words…`);
    await dbClearStore('words');
    await dbPutBatch('words', words);
    WORDS = words;

    // Extract audio from ZIP
    if (detectedFields.wordAudio || detectedFields.sentenceAudio) {
      await extractAudio(zip, words);
    }

    setStatus(`✓ Imported ${words.length} word pairs`, 'success');
    setTimeout(() => showLevelSelect(), 800);

  } catch (err) {
    setStatus('Error: ' + err.message, 'error');
    console.error(err);
  }
}

async function extractAudio(zip, words) {
  // Build media filename map
  const mediaEntry = zip.file('media');
  if (!mediaEntry) return;

  let mediaMap = {};
  try {
    const mediaJson = await mediaEntry.async('string');
    const raw = JSON.parse(mediaJson); // { "0": "filename.mp3", ... }
    // invert: filename -> zip entry name (which is the index number)
    for (const [idx, fname] of Object.entries(raw)) {
      mediaMap[fname] = idx;
    }
  } catch { return; }

  // Collect unique audio filenames
  const audioFiles = new Set();
  for (const w of words) {
    if (w.wordAudio) audioFiles.add(w.wordAudio);
    if (w.sentenceAudio) audioFiles.add(w.sentenceAudio);
  }

  if (audioFiles.size === 0) return;

  const fileList = [...audioFiles];
  const total = fileList.length;
  let done = 0;
  let skipped = 0;
  const BATCH = 100;

  await dbClearStore('audio');

  for (let i = 0; i < fileList.length; i += BATCH) {
    const batch = fileList.slice(i, i + BATCH);
    const entries = [];

    for (const fname of batch) {
      const zipIdx = mediaMap[fname];
      if (zipIdx === undefined) { skipped++; continue; }
      const entry = zip.file(zipIdx);
      if (!entry) { skipped++; continue; }
      try {
        const buf = await entry.async('arraybuffer');
        entries.push({ key: fname, value: buf });
        done++;
      } catch { skipped++; }
    }

    if (entries.length > 0) {
      await dbPutBatch('audio', entries);
    }

    setStatus(`Extracting audio (${done}/${total})…`);
    await new Promise(r => setTimeout(r, 0)); // yield to event loop
  }

  if (skipped > 0) {
    setStatus(`✓ Audio: ${done} files saved, ${skipped} missing`);
  }
}

function extractWords(db) {
  const colRes = db.exec("SELECT models FROM col LIMIT 1");
  if (!colRes.length) return { words: [], detectedFields: {}, allFieldNames: [] };

  const models = JSON.parse(colRes[0].values[0][0]);
  const modelFields = {};
  const allFieldNames = [];
  for (const mid in models) {
    const names = models[mid].flds.map(f => f.name);
    modelFields[mid] = names.map(n => n.toLowerCase());
    allFieldNames.push(...names);
  }

  const notesRes = db.exec("SELECT mid, flds FROM notes");
  if (!notesRes.length) return { words: [], detectedFields: {}, allFieldNames };

  const words = [];
  const seen = new Set();
  const detectedFields = { rank: false, sentence: false, sentenceEn: false, wordAudio: false, sentenceAudio: false };

  let autoRank = 1;

  let debugLogged = false;
  for (const [mid, flds] of notesRes[0].values) {
    const fields = flds.split('\x1f');
    const names = modelFields[mid] || [];

    const enIdx = findFieldIndex(names, fields, 'en');
    const grIdx = findFieldIndex(names, fields, 'gr');

    // Debug: log field mapping for first note only
    if (!debugLogged) {
      debugLogged = true;
      const rankIdx2 = findRankIndex(names, fields);
      const sentIdx2 = findSentenceIndex(names, fields);
      const sentEnIdx2 = findSentenceEnIndex(names, fields);
      const audioIdx2 = findAudioIndex(names, fields, 'audio');
      const audio2Idx2 = findAudioIndex(names, fields, 'audio2');
      console.log('Field names:', names);
      console.log('Field values (first note):', fields);
      console.log('Mapped fields:', {
        en: `[${enIdx}] ${names[enIdx]}`,
        gr: `[${grIdx}] ${names[grIdx]}`,
        rank: `[${rankIdx2}] ${names[rankIdx2]}`,
        sentence: `[${sentIdx2}] ${names[sentIdx2]}`,
        sentenceEn: `[${sentEnIdx2}] ${names[sentEnIdx2]}`,
        audio: `[${audioIdx2}] ${names[audioIdx2]}`,
        audio2: `[${audio2Idx2}] ${names[audio2Idx2]}`,
      });
    }

    if (enIdx === -1 || grIdx === -1 || enIdx === grIdx) continue;

    let en = stripHtml(stripSound(fields[enIdx])).trim();
    let gr = stripHtml(stripSound(fields[grIdx])).trim();
    if (!en || !gr) continue;

    const key = en.toLowerCase() + '|' + gr.toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);

    // Extract rank
    let rank = autoRank++;
    const rankIdx = findRankIndex(names, fields);
    if (rankIdx !== -1) {
      const rv = parseInt(stripHtml(fields[rankIdx]).trim(), 10);
      if (!isNaN(rv) && rv > 0) { rank = rv; detectedFields.rank = true; }
    }

    // Extract sentence
    let sentence = '';
    let sentenceEn = '';
    const sentIdx = findSentenceIndex(names, fields);
    if (sentIdx !== -1) {
      sentence = stripHtml(stripSound(fields[sentIdx])).trim();
      detectedFields.sentence = true;
    }
    const sentEnIdx = findSentenceEnIndex(names, fields);
    if (sentEnIdx !== -1) {
      sentenceEn = stripHtml(stripSound(fields[sentEnIdx])).trim();
      detectedFields.sentenceEn = true;
    }

    // Extract audio filenames — check dedicated Audio/Audio2 fields first, then fallback to sound tags in word/sentence fields
    let wordAudio = '';
    let sentenceAudio = '';

    const audioIdx = findAudioIndex(names, fields, 'audio');
    const audio2Idx = findAudioIndex(names, fields, 'audio2');

    if (audioIdx !== -1) {
      wordAudio = extractSoundTag(fields[audioIdx]) || fields[audioIdx].trim();
    }
    if (audio2Idx !== -1) {
      sentenceAudio = extractSoundTag(fields[audio2Idx]) || fields[audio2Idx].trim();
    }

    // Fallback: sound tags embedded in word/sentence fields
    if (!wordAudio) wordAudio = extractSoundTag(fields[grIdx]) || extractSoundTag(fields[enIdx]) || '';
    if (!sentenceAudio && sentIdx !== -1) sentenceAudio = extractSoundTag(fields[sentIdx]) || '';

    if (wordAudio) detectedFields.wordAudio = true;
    if (sentenceAudio) detectedFields.sentenceAudio = true;

    words.push({ en, gr, rank, sentence, sentenceEn, wordAudio, sentenceAudio });
  }

  // Sort by rank for consistent ordering
  words.sort((a, b) => a.rank - b.rank);

  return { words, detectedFields, allFieldNames };
}

function findFieldIndex(names, values, lang) {
  // Words to exclude: fields that are clearly example/sentence/audio, not the main word field
  const excludeWords = ['example', 'sentence', 'context', 'usage', 'audio'];
  const isExcluded = n => excludeWords.some(w => n.includes(w));

  const enHints = ['english meaning', 'english word', 'english', 'meaning', 'translation', 'en', 'front', 'word'];
  const grHints = ['greek word', 'greek', 'gr', 'back', 'target', 'ελληνικά'];
  const hints = lang === 'en' ? enHints : grHints;

  for (const hint of hints) {
    const i = names.findIndex(n => n.includes(hint) && !isExcluded(n.replace(hint, '')));
    if (i !== -1 && i < values.length) return i;
  }
  // Script-based fallback
  if (lang === 'gr') {
    return values.findIndex(v => /[\u0370-\u03FF\u1F00-\u1FFF]/.test(stripHtml(v)));
  } else {
    return values.findIndex(v => v && /^[A-Za-z\s\-\/,.']+$/.test(stripHtml(v).trim()) && stripHtml(v).trim().length > 0);
  }
}

function findRankIndex(names, values) {
  // Exact name "Rank" first, then broader hints
  const hints = ['rank', 'frequency', 'freq', 'position', 'order'];
  for (const hint of hints) {
    const i = names.findIndex(n => n === hint || n.startsWith(hint));
    if (i !== -1 && i < values.length) return i;
  }
  // Field whose stripped value is purely numeric
  return values.findIndex(v => /^\d+$/.test(stripHtml(v).trim()));
}

function findSentenceIndex(names, values) {
  // Look for Greek example: "Greek Example", "Greek Sentence", "Example", "Sentence" — but NOT "English *"
  const hints = ['greek example', 'greek sentence', 'example sentence', 'sentence gr', 'example gr'];
  for (const hint of hints) {
    const i = names.findIndex(n => n.includes(hint));
    if (i !== -1 && i < values.length && values[i]) return i;
  }
  // Broader: any field with 'example' or 'sentence' that doesn't start with 'english' or 'audio'
  const broad = ['example', 'sentence', 'context', 'usage'];
  for (const hint of broad) {
    const i = names.findIndex(n => n.includes(hint) && !n.startsWith('english') && !n.startsWith('audio') && !n.includes('audio'));
    if (i !== -1 && i < values.length && values[i]) return i;
  }
  return -1;
}

function findSentenceEnIndex(names, values) {
  // "English Example", "English Sentence", "Sentence Translation", "Example Translation"
  const hints = ['english example', 'english sentence', 'sentence translation', 'example translation', 'sentence en', 'example en'];
  for (const hint of hints) {
    const i = names.findIndex(n => n.includes(hint));
    if (i !== -1 && i < values.length && values[i]) return i;
  }
  return -1;
}

function findAudioIndex(names, values, audioHint) {
  // Find an audio field by name hint (e.g. 'audio', 'audio2')
  const i = names.findIndex(n => n === audioHint);
  if (i !== -1 && i < values.length && values[i]) return i;
  // Partial match
  const j = names.findIndex(n => n.includes(audioHint));
  if (j !== -1 && j < values.length && values[j]) return j;
  return -1;
}

function stripHtml(str) {
  if (!str) return '';
  return str.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').trim();
}

function stripSound(str) {
  if (!str) return '';
  return str.replace(/\[sound:[^\]]+\]/g, '');
}

function extractSoundTag(str) {
  if (!str) return '';
  const m = str.match(/\[sound:([^\]]+)\]/);
  return m ? m[1] : '';
}

function loadScript(src) {

    if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
    const s = document.createElement('script');

    s.onload = resolve;
    s.onerror = () => reject(new Error('Failed to load: ' + src));
    document.head.appendChild(s);
  });
}

// Interpolate tile colour based on completion (0–100)
function tileStyle(completed, locked) {
  if (locked) return '';
  const t = Math.min(completed / 100, 1); // 0..1

  // Colour stops: dark → bronze → silver → gold
  // bg: #181c2a → #1e1810 → #1a1a20 → #1f1a08
  // border: #252a3d → #7c4a1a → #8a8a9a → #c9960c
  // glow: none → bronze → silver → gold
  function lerp(a, b, t) { return Math.round(a + (b - a) * t); }
  function lerpHex(c1, c2, t) {
    const p = (h) => parseInt(h, 16);
    const r = lerp(p(c1.slice(1,3)), p(c2.slice(1,3)), t);
    const g = lerp(p(c1.slice(3,5)), p(c2.slice(3,5)), t);
    const b = lerp(p(c1.slice(5,7)), p(c2.slice(5,7)), t);
    return `rgb(${r},${g},${b})`;
  }

  let bg, border, shadow, titleColor;

  if (t <= 0) {
    return ''; // pure CSS default
  } else if (t < 0.5) {
    // 0 → 50%: dark to bronze
    const u = t / 0.5;
    bg     = lerpHex('#181c2a', '#1e1608', u);
    border = lerpHex('#252a3d', '#8b5e1a', u);
    shadow = `0 0 ${Math.round(u * 8)}px rgba(139,94,26,${(u * 0.4).toFixed(2)})`;
    titleColor = lerpHex('#7c85a6', '#b07830', u);
  } else if (t < 1) {
    // 50% → 100%: bronze to gold
    const u = (t - 0.5) / 0.5;
    bg     = lerpHex('#1e1608', '#221a00', u);
    border = lerpHex('#8b5e1a', '#d4a017', u);
    shadow = `0 0 ${Math.round(8 + u * 14)}px rgba(212,160,23,${(0.4 + u * 0.45).toFixed(2)})`;
    titleColor = lerpHex('#b07830', '#f5c518', u);
  } else {
    // 100%: full gold
    bg     = '#231c00';
    border = '#f5c518';
    shadow = '0 0 22px rgba(245,197,24,0.85), 0 0 6px rgba(245,197,24,0.5)';
    titleColor = '#f5c518';
  }

  return `background:${bg}; border-color:${border}; box-shadow:${shadow}; --tile-title-color:${titleColor};`;
}

function getTileCounts(levelWords, dir, srs) {
  const now = Date.now();
  let newCount = 0, learningCount = 0, dueCount = 0;
  for (const w of levelWords) {
    const cd = srs[cardKey(w, dir)];
    const reps = cd ? (cd.reps || 0) : 0;
    const nextReview = cd ? (cd.nextReview || 0) : 0;
    if (reps === 0) {
      newCount++;
    } else if (reps <= 3 && nextReview <= now) {
      learningCount++;
    } else if (reps >= 4 && nextReview <= now) {
      dueCount++;
    }
  }
  return { newCount, learningCount, dueCount };
}

function renderLevelGrids() {
  renderGrid('en');
  renderGrid('gr');
}

function renderGrid(dir) {
  const srs = loadSRS();
  const grid = document.getElementById(`grid-${dir}`);
  grid.innerHTML = '';

  const maxRank = WORDS.length > 0 ? Math.max(...WORDS.map(w => w.rank || 0), 100) : 2500;
  const numLevels = Math.ceil(maxRank / 100);
  const levels = Math.min(numLevels, 25);

  for (let lvl = 1; lvl <= levels; lvl++) {
    const rankMin = (lvl - 1) * 100 + 1;
    const rankMax = lvl * 100;
    const levelWords = WORDS.filter(w => w.rank >= rankMin && w.rank <= rankMax);
    const total = levelWords.length;

    let completed = 0;
    for (const w of levelWords) {
      const cd = srs[cardKey(w, dir)];
      if (cd && cd.complete) completed++;
    }

    // Unlock logic: level 1 always unlocked; level N+1 unlocks when ≥75 complete in level N
    let locked = false;
    if (lvl > 1) {
      const prevMin = (lvl - 2) * 100 + 1;
      const prevMax = (lvl - 1) * 100;
      const prevWords = WORDS.filter(w => w.rank >= prevMin && w.rank <= prevMax);
      let prevCompleted = 0;
      for (const w of prevWords) {
        const cd = srs[cardKey(w, dir)];
        if (cd && cd.complete) prevCompleted++;
      }
      locked = prevCompleted < 75 && prevWords.length >= 75;
    }

    const pct = total > 0 ? Math.round((completed / 100) * 100) : 0;

    const tile = document.createElement('div');
    tile.className = 'level-tile' + (locked ? ' locked' : '');
    const style = tileStyle(completed, locked);
    if (style) tile.setAttribute('style', style);

    // Progress bar colour: blue at 0%, shifts to gold at 100%
    const barColor = completed >= 100
      ? 'linear-gradient(90deg,#c9960c,#f5c518)'
      : completed >= 50
        ? `linear-gradient(90deg,#a06820,#d4a017)`
        : 'linear-gradient(90deg,#4f7cff,#a78bfa)';

    const { newCount, learningCount, dueCount } = getTileCounts(levelWords, dir, srs);
    tile.innerHTML = `
      <div class="level-tile-title" style="color:var(--tile-title-color,#7c85a6)">Level ${lvl}</div>
      <div class="level-tile-range">${rankMin}–${rankMax}</div>
      <div class="level-tile-progress">${completed}/100 complete</div>
      <div class="level-tile-bar"><div class="level-tile-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
      <div class="tile-counts">
        ${!locked && newCount > 0      ? `<span class="tc-new">${newCount}</span>` : ''}
        ${!locked && learningCount > 0 ? `<span class="tc-learning">${learningCount}</span>` : ''}
        ${!locked && dueCount > 0      ? `<span class="tc-due">${dueCount}</span>` : ''}
      </div>
      ${locked ? '<div class="level-lock-icon">🔒</div>' : ''}
    `;
    if (!locked) {
      tile.addEventListener('click', () => startLevelSession(lvl, dir));
    }
    grid.appendChild(tile);
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// SESSION
// ═══════════════════════════════════════════════════════════════════════════════
function startLevelSession(level, dir) {
  sessionMode = dir;
  sessionRankMin = (level - 1) * 100 + 1;
  sessionRankMax = level * 100;
  sessionReadonly = false;
  startSession();
}

function startSession() {
  document.getElementById('session-end').classList.remove('active');
  showMain();
  buildQueue();

  if (queue.length === 0) {
    document.getElementById('progress-label').textContent = 'No cards due — come back later!';
    document.getElementById('front-word').textContent = '';
    document.getElementById('front-lang').textContent = '';
    cardState = 'loading';
    return;
  }

  // Show/hide keyboard hint
  if (!prefs.firstCardSeen) {
    document.getElementById('kbd-hint').style.display = 'block';
  } else {
    document.getElementById('kbd-hint').style.display = 'none';
  }

  nextCard();
}

function buildQueue() {
  if (WORDS.length === 0) { queue = []; return; }

  const srs = loadSRS();
  const now = Date.now();
  const dirs = sessionMode === 'both' ? ['en','gr'] : [sessionMode];
  const due = [], fresh = [];

  const wordsInRange = sessionRankMin !== null
    ? WORDS.filter(w => w.rank >= sessionRankMin && w.rank <= sessionRankMax)
    : WORDS;

  // Sort by rank ascending for fresh cards
  const sorted = [...wordsInRange].sort((a, b) => (a.rank || 0) - (b.rank || 0));

  for (const word of sorted) {
    for (const dir of dirs) {
      const cd = getCardData(srs, word, dir);
      if (cd.nextReview <= now) {
        const card = { word, dir };
        if (cd.reps === 0) fresh.push(card);
        else due.push(card);
      }
    }
  }

  shuffle(due);
  queue = [...due, ...fresh].slice(0, 20);
  sessionTotal = queue.length;
  sessionCorrect = 0;
  sessionWrong = 0;
  sessionMastered = 0;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function nextCard(animate) {
  if (queue.length === 0) { showEnd(); return; }

  const next = queue.shift();
  cardState = 'loading';
  stopAudio();

  const doSwap = () => {
    current = next;
    loadCardContent(current);
    updateProgress();
    // cardState stays 'loading' until doPageTurn calls onReady after phase2

    // Always track audio files for current card
    currentAudioFile = current.word.wordAudio || null;
    sentenceAudioFile = current.word.sentenceAudio || null;
  };

  const doReady = () => {
    cardState = 'question';
    // Track 'seen' (not for readonly/custom-range sessions)
    if (!sessionReadonly) {
      const srs = loadSRS();
      const cd = getCardData(srs, current.word, current.dir);
      cd.seen = (cd.seen || 0) + 1;
      const today = new Date().toISOString().slice(0, 10);
      if (!cd.days.includes(today)) cd.days.push(today);
      saveSRS(srs);
    }
    // GR→EN: play word audio after card is fully visible
    if (current.dir === 'gr' && current.word.wordAudio) {
      playAudio(current.word.wordAudio);
    }
  };

  if (animate) {
    doPageTurn(doSwap, doReady);
  } else {
    // First card: just reset card state without animation
    const card = document.getElementById('card');
    card.classList.remove('flipped', 'complete-glow', 'flying');
    document.getElementById('btn-row').classList.remove('visible');
    resetSentence();
    doSwap();
    doReady();
  }
}

function loadCardContent(c) {
  const isEnGr = c.dir === 'en';
  const card = document.getElementById('card');
  card.classList.remove('flipped', 'complete-glow', 'flying');
  document.getElementById('btn-row').classList.remove('visible');
  document.getElementById('front-lang').textContent = isEnGr ? 'English' : 'Eλληνικά';
  document.getElementById('front-word').textContent = isEnGr ? c.word.en : c.word.gr;
  document.getElementById('back-lang').textContent = isEnGr ? 'Eλληνικά' : 'English';
  document.getElementById('back-word').textContent = isEnGr ? c.word.gr : c.word.en;
  resetSentence();
  updateFreqBadge(c.word);
}

function resetSentence() {
  const sgr = document.getElementById('sentence-gr');
  const sen = document.getElementById('sentence-en');
  sgr.classList.remove('visible');
  sen.classList.remove('visible');
  sgr.textContent = '';
  sen.textContent = '';
}

function updateFreqBadge(word) {
  const badge = document.getElementById('freq-badge');
  if (!word.rank) { badge.textContent = ''; return; }
  const rank = word.rank;
  let color;
  if (rank <= 100) color = '#f5c518';
  else if (rank <= 500) color = '#a0a0b0';
  else if (rank <= 1000) color = '#cd7f32';
  else color = '#4a5170';
  badge.textContent = `#${rank}`;
  badge.style.color = color;
}

function flipCard() {
  if (cardState !== 'question' || !current) return;
  document.getElementById('card').classList.add('flipped');
  document.getElementById('btn-row').classList.add('visible');
  cardState = 'answer';

  // Dismiss keyboard hint on first flip
  if (!prefs.firstCardSeen) {
    prefs.firstCardSeen = true;
    savePrefs();
    document.getElementById('kbd-hint').style.display = 'none';
  }

  // EN→GR: play word audio on flip
  if (current.dir === 'en' && current.word.wordAudio) {
    playAudio(current.word.wordAudio);
    currentAudioFile = current.word.wordAudio;
  }
}

function onCardClick() {
  switch (cardState) {
    case 'question':      flipCard(); break;
    case 'answer-wrong':  advanceFromAnswer(); break;
    case 'sentence':      advanceFromSentence(); break;
    case 'translation':   advanceFromTranslation(); break;
    case 'no-sentence':   nextCard(true); break;
  }
}

function answer(correct) {
  if (cardState !== 'answer' || !current) return;

  const answering = current;
  let justCompleted = false;

  if (sessionReadonly) {
    // Custom range: track session counts only, no SRS writes
    if (correct) sessionCorrect++;
    else { sessionWrong++; queue.push(answering); }
  } else {
    const srs = loadSRS();
    const cd = getCardData(srs, answering.word, answering.dir);
    const wasComplete = cd.complete;

    if (correct) {
      sessionCorrect++;
      cd.correct = (cd.correct || 0) + 1;
      cd.reps = (cd.reps || 0) + 1;
      cd.streak = (cd.streak || 0) + 1;

      // Anki SM-2: initial learning steps 1→2→3 days, then multiply by easeFactor
      if (cd.reps === 1)      { cd.interval = 1; }
      else if (cd.reps === 2) { cd.interval = 2; }
      else if (cd.reps === 3) { cd.interval = 3; }
      else {
        // Graduating review: new_interval = max(prev+1, round(prev * easeFactor))
        const next = Math.round(cd.interval * cd.easeFactor);
        cd.interval = Math.max(cd.interval + 1, next);
      }
      // Ease only increases once card has graduated (reps >= 4)
      if (cd.reps >= 4) {
        cd.easeFactor = Math.min(4.0, Math.max(1.3, (cd.easeFactor || 2.5) + 0.1));
      }

      if (cd.reps >= 4 && !wasComplete) {
        cd.complete = true;
        justCompleted = true;
        sessionMastered++;
      }
    } else {
      sessionWrong++;
      cd.incorrect = (cd.incorrect || 0) + 1;
      cd.streak = 0;
      cd.reps = 0;
      cd.interval = 1;
      // Anki "Again": ease -= 0.2 (min 1.3)
      cd.easeFactor = Math.max(1.3, (cd.easeFactor || 2.5) - 0.2);
      queue.push(answering); // re-queue wrong cards
    }

    cd.nextReview = Date.now() + cd.interval * 86400000;
    saveSRS(srs);
  }

  document.getElementById('btn-row').classList.remove('visible');
  cardState = 'sentence';

  // Show sentence immediately on correct, after Space on wrong
  if (answering.word.sentence) {
    const sgr = document.getElementById('sentence-gr');
    sgr.textContent = answering.word.sentence;

    if (correct) {
      // Correct: sentence fades in instantly
      requestAnimationFrame(() => { sgr.classList.add('visible'); });
      if (answering.word.sentenceAudio) {
        playAudio(answering.word.sentenceAudio);
        currentAudioFile = answering.word.wordAudio || null;
        sentenceAudioFile = answering.word.sentenceAudio;
      }
      cardState = 'sentence';
    } else {
      // Wrong: sentence will appear on next Space press
      cardState = 'answer-wrong'; // special state: wrong answer given, sentence not yet shown
    }
  } else {
    // No sentence: proceed straight after a short pause
    cardState = 'no-sentence';
  }

  if (justCompleted) {
    triggerCompleteAnimation(answering, correct);
  }
}

function advanceFromAnswer() {
  // Called when Space is pressed after wrong answer (to show sentence)
  if (!current) return;
  const sgr = document.getElementById('sentence-gr');
  if (current.word.sentence) {
    sgr.textContent = current.word.sentence;
    requestAnimationFrame(() => { sgr.classList.add('visible'); });
    if (current.word.sentenceAudio) {
      playAudio(current.word.sentenceAudio);
      sentenceAudioFile = current.word.sentenceAudio;
    }
    cardState = 'sentence';
  } else {
    nextCard(true);
  }
}

function advanceFromSentence() {
  // Show translation
  if (!current) return;
  if (current.word.sentenceEn) {
    const sen = document.getElementById('sentence-en');
    sen.textContent = current.word.sentenceEn;
    requestAnimationFrame(() => { sen.classList.add('visible'); });
    cardState = 'translation';
  } else {
    nextCard(true);
  }
}

function advanceFromTranslation() {
  nextCard(true);
}

// ═══════════════════════════════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════════════════════════════
function setupKeyboardShortcuts() {
  document.addEventListener('keydown', e => {
    // Only act when main-view is visible
    if (!document.getElementById('main-view').classList.contains('active')) return;

    if (e.key === 'Enter') {
      e.preventDefault();
      replayAudio();
      return;
    }

    if (e.key === ' ') {
      e.preventDefault();
      switch (cardState) {
        case 'question':      flipCard(); break;
        case 'answer':        answer(true); break;
        case 'answer-wrong':  advanceFromAnswer(); break;
        case 'sentence':      advanceFromSentence(); break;
        case 'translation':   advanceFromTranslation(); break;
        case 'no-sentence':   nextCard(true); break;
      }
    }

    if (e.key === 'Backspace') {
      if (cardState === 'answer') {
        e.preventDefault();
        answer(false);
      }
    }
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════════════════════════
async function playAudio(filename) {
  if (!filename) return;
  try {
    const buf = await dbGet('audio', filename);
    if (!buf) return;

    const blob = new Blob([buf]);
    const newUrl = URL.createObjectURL(blob);

    const audioEl = document.getElementById('audio-el');
    audioEl.pause();
    audioEl.currentTime = 0;

    const oldUrl = currentBlobUrl;
    currentBlobUrl = newUrl;

    audioEl.src = newUrl;
    audioEl.volume = prefs.volume;
    audioEl.play().catch(() => {});

    if (oldUrl) URL.revokeObjectURL(oldUrl);

    document.getElementById('btn-speaker').classList.add('active');
    audioEl.onended = () => {
      document.getElementById('btn-speaker').classList.remove('active');
    };
  } catch {}
}

function stopAudio() {
  const audioEl = document.getElementById('audio-el');
  audioEl.pause();
  audioEl.currentTime = 0;
  if (currentBlobUrl) {
    URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = null;
  }
  document.getElementById('btn-speaker').classList.remove('active');
}

function replayAudio() {
  const audioEl = document.getElementById('audio-el');
  // If sentence is visible, replay sentence audio; otherwise replay word audio
  const isSentenceState = (cardState === 'sentence' || cardState === 'translation');
  const file = isSentenceState && sentenceAudioFile ? sentenceAudioFile : currentAudioFile;
  if (file) {
    playAudio(file);
  } else {
    audioEl.currentTime = 0;
    audioEl.play().catch(() => {});
  }
}

function toggleAudioControls(e) {
  e.stopPropagation();
  audioControlsOpen = !audioControlsOpen;
  document.getElementById('volume-popover').classList.toggle('open', audioControlsOpen);
}

function setupVolumeSlider() {
  const slider = document.getElementById('volume-slider');
  slider.value = prefs.volume;
  slider.addEventListener('input', () => {
    prefs.volume = parseFloat(slider.value);
    document.getElementById('audio-el').volume = prefs.volume;
    savePrefs();
  });

  document.addEventListener('click', e => {
    if (audioControlsOpen && !document.getElementById('audio-controls').contains(e.target)) {
      audioControlsOpen = false;
      document.getElementById('volume-popover').classList.remove('open');
    }
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
// CARD TRANSITION (reuses the same flip animation as answer reveal)
// ═══════════════════════════════════════════════════════════════════════════════
function doPageTurn(onMidpoint, onReady) {
  const card = document.getElementById('card');
  const HALF = 250; // ms per half — matches the 0.5s transition split in two

  // Phase 1: flip to back (0° → 180°)
  card.classList.remove('complete-glow', 'flying');
  card.classList.add('flipped');

  setTimeout(() => {
    // At 180° (back face showing): swap content and unflip
    onMidpoint();
    card.classList.remove('flipped');

    setTimeout(() => {
      if (onReady) onReady();
    }, HALF);
  }, HALF);
}

// ═══════════════════════════════════════════════════════════════════════════════
// COMPLETE ANIMATION
// ═══════════════════════════════════════════════════════════════════════════════
function triggerCompleteAnimation(answering, correct) {
  const card = document.getElementById('card');
  card.classList.add('complete-glow');

  setTimeout(() => {
    card.classList.add('flying');

    // Pulse bag
    setTimeout(() => {
      const bag = document.getElementById('bag-icon');
      bag.classList.add('pulse');
      setTimeout(() => bag.classList.remove('pulse'), 600);
    }, 350);
  }, 300);
}

// ═══════════════════════════════════════════════════════════════════════════════
// PROGRESS & END
// ═══════════════════════════════════════════════════════════════════════════════
function updateProgress() {
  const done = sessionTotal - queue.length - 1;
  const pct = sessionTotal > 0 ? Math.max(0, (done / sessionTotal) * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent =
    `${Math.max(0, done)} / ${sessionTotal} cards`;
}

function abandonSession() {
  stopAudio();
  queue = [];
  showLevelSelect();
}

function showEnd() {
  stopAudio();
  showView('session-end');

  const srs = loadSRS();
  const now = Date.now();
  const dirs = sessionMode === 'both' ? ['en','gr'] : [sessionMode];
  let totalDue = 0;
  const checkWords = sessionRankMin !== null
    ? WORDS.filter(w => w.rank >= sessionRankMin && w.rank <= sessionRankMax)
    : WORDS;
  for (const word of checkWords) {
    for (const dir of dirs) {
      const cd = getCardData(srs, word, dir);
      if (cd.nextReview <= now + 86400000) totalDue++;
    }
  }

  document.getElementById('session-stats').innerHTML =
    `Correct: <span>${sessionCorrect}</span> &nbsp;|&nbsp; Wrong: <span>${sessionWrong}</span><br>` +
    `Mastered this session: <span>${sessionMastered}</span><br>` +
    `Cards due tomorrow: <span>${totalDue}</span>`;
}

// ═══════════════════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════════════════
init();
</script>
